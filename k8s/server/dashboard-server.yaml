apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtm-dashboard-server-deployment
  namespace: rtm-client-environment
spec:
  replicas: 1
  selector:
    matchLabels:
      component: dashboard-server
  template:
    metadata:
      labels:
        component: dashboard-server
    spec:
      containers:
        - name: dashboard-server
          image: 07kamal03/dashboard-be:v4.0
          ports:
            - containerPort: 9000
          env:
            - name: DATABASE_URL
              value: "http://rtm-db-service.rtm-client-environment.svc.cluster.local:5432"
---
apiVersion: v1
kind: Service
metadata:
  name: rtm-dashboard-server-service
  namespace: rtm-client-environment
spec:
  selector:
    component: dashboard-server
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 9000
      targetPort: 9000
