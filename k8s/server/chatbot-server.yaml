apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtm-chatbot-server-deployment
  namespace: rtm-client-environment
spec:
  replicas: 1
  selector:
    matchLabels:
      component: chatbot-server
  template:
    metadata:
      labels:
        component: chatbot-server
    spec:
      containers:
        - name: chatbot-server
          image: 07kamal03/chatbot-be:v20.0
          ports:
            - containerPort: 8000
          env:  
            - name: DATABASE_URL
              value: "http://rtm-db-service.rtm-client-environment.svc.cluster.local:5432"
            - name: DEEPSEEK_URL
              value: "http://rtm-deepseek-llm-service.rtm-client-environment.svc.cluster.local:11434"
            - name: DASHBOARD_URL
              value: "http://rtm-dashboard-server-service.rtm-client-environment.svc.cluster.local:9000"
---
apiVersion: v1
kind: Service
metadata:
  name: rtm-chatbot-server-service
  namespace: rtm-client-environment
spec:
  selector:
    component: chatbot-server
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
