apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtm-deepseek-llm-deployment
  namespace: rtm-client-environment
spec:
  replicas: 1
  selector:
    matchLabels:
      component: deepseek-llm
  template:
    metadata:
      labels:
        component: deepseek-llm
    spec:
      containers:
        - name: deepseek
          image: 07kamal03/deepseek-7b:7b
          ports:
            - containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
---
apiVersion: v1
kind: Service
metadata:
  name: rtm-deepseek-llm-service
  namespace: rtm-client-environment
spec:
  selector:
    component: deepseek-llm
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 11434
      targetPort: 11434
